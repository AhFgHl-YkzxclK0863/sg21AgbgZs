<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexoria — Offline</title>
<meta name="theme-color" content="#050308">
<style>
:root{--bg:#050308;--card:#0f0c1e;--cardhi:#151230;--line:#8b7bff2b;--ink:#f3f1ff;--mute:#9a93c2;--cy:#39f4ff;--mg:#ff2fa6;--vi:#8b5cf6;--ok:#33f2a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));overflow:hidden;position:relative}
.bh{position:absolute;width:420px;height:420px;top:-140px;right:-140px;pointer-events:none}
.bh::before{content:'';position:absolute;inset:-45%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,var(--cy) 35deg,transparent 90deg,var(--mg) 170deg,transparent 230deg,var(--vi) 300deg,transparent 360deg);filter:blur(22px);opacity:.7;animation:spin 22s linear infinite}
.bh::after{content:'';position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c1236 0%,#050308 55%,#000 100%);box-shadow:0 0 70px 14px #000,inset 0 0 46px #000}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bh::before{animation:none}}
.card{position:relative;z-index:1;width:min(92vw,420px);text-align:center;padding:34px 24px 26px;border-radius:24px;background:linear-gradient(180deg,var(--cardhi),var(--card));border:1px solid var(--line);box-shadow:0 30px 90px #000c}
.logo{font-weight:900;font-size:clamp(30px,9vw,42px);letter-spacing:.12em;margin:0;line-height:1;background:linear-gradient(90deg,var(--cy),var(--vi) 55%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{font-size:46px;margin:22px 0 4px}
h2{margin:0 0 8px;font-size:20px}
p{margin:0 0 22px;color:var(--mute);font-size:14px;line-height:1.6}
.btn{width:100%;height:52px;border:0;border-radius:14px;font-size:16px;font-weight:800;color:#04101c;background:linear-gradient(90deg,var(--cy),var(--vi));cursor:pointer;box-shadow:0 10px 28px #39f4ff33}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.6}
.st{min-height:18px;margin:14px 0 0;font-size:13px;font-weight:700;color:var(--mute)}
.st.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="bh"></div>
<div class="card">
  <h1 class="logo">NEXORIA</h1>
  <div class="ico">📡</div>
  <h2>Kamu sedang offline</h2>
  <p>Game ini butuh internet untuk dimainkan.<br>Nyalakan Wi-Fi atau data seluler, lalu coba lagi.</p>
  <button class="btn" id="retry">COBA LAGI</button>
  <div class="st" id="st" role="status"></div>
</div>
<script>
(function(){
  var st=document.getElementById('st'),btn=document.getElementById('retry'),busy=false;
  function go(){location.replace('./');}
  function retry(){
    if(busy)return;busy=true;btn.disabled=true;st.className='st';st.textContent='Memeriksa koneksi…';
    var ctl=window.AbortController?new AbortController():null;
    var t=setTimeout(function(){if(ctl)ctl.abort();},6000);
    fetch('./?_='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(t);if(!r.ok)throw 0;st.className='st ok';st.textContent='Tersambung! Membuka game…';setTimeout(go,300);})
      .catch(function(){clearTimeout(t);busy=false;btn.disabled=false;st.className='st';st.textContent='Masih offline. Coba lagi sebentar.';});
  }
  btn.addEventListener('click',retry);
  window.addEventListener('online',retry);
})();
</script>
</body>
</html>
